inherit_from: .rubocop_todo.yml

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  Exclude:
    - vendor/**/*
    - amzn-models/**/*
    - tmp/**/*
    - bin/**/*
    # CI matrix gemfiles, not gem code.
    - gemfiles/**/*
    # Autogenerated require shims; the Rakefile writes them.
    - lib/amazon_sp_clients/sp_*.rb
    # Generated V2 API classes and their entry file; the generator writes them.
    - lib/amazon_sp_clients/v2/apis/**/*
    - lib/amazon_sp_clients/v2/apis.rb

# Start permissive on the handwritten code; tighten later.
Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

# Grouping accessors would detach them from their doc comments.
Style/AccessorGrouping:
  Enabled: false

Layout/LineLength:
  Max: 100
