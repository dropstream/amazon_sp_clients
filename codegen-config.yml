---
# APIs generated into vendor/ by `bundle exec rake generate`.
# Only modules with actual consumers across Dropstream are listed;
# paths are relative to amzn-models/models at the SHA pinned in
# selling-partner-api-models.sha.
list_of_apis:
  - name: fba_inventory
    path: fba-inventory-api-model/fbaInventory.json
    templates: [v1, v2]

  - name: feeds_2021
    path: feeds-api-model/feeds_2021-06-30.json
    templates: [v1, v2]

  - name: fulfillment_outbound_2020
    path: fulfillment-outbound-api-model/fulfillmentOutbound_2020-07-01.json
    templates: [v1, v2]

  - name: listings_items_2021
    path: listings-items-api-model/listingsItems_2021-08-01.json
    templates: [v1, v2]

  - name: orders_v0
    path: orders-api-model/ordersV0.json
    templates: [v1, v2]

  - name: reports_2021
    path: reports-api-model/reports_2021-06-30.json
    templates: [v1, v2]

  - name: tokens_2021
    path: tokens-api-model/tokens_2021-03-01.json
    templates: [v1, v2]

  - name: vdf_inventory_v1
    path: vendor-direct-fulfillment-inventory-api-model/vendorDirectFulfillmentInventoryV1.json
    templates: [v1, v2]

  - name: vdf_orders_v1
