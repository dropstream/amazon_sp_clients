    templates: [v1, v2]

  - name: vendor_invoices
    path: vendor-invoices-api-model/vendorInvoices.json
    templates: [v1, v2]

  - name: vendor_orders
    path: vendor-orders-api-model/vendorOrders.json
    templates: [v1, v2]

  - name: vendor_transaction_status
    path: vendor-transaction-status-api-model/vendorTransactionStatus.json
    templates: [v1, v2]

  - name: vendors_shipments
    path: vendor-shipments-api-model/vendorShipments.json
    templates: [v1, v2]
