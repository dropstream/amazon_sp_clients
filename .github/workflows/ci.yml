name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rubocop

  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
        gemfile: [faraday_1, faraday_2]
    runs-on: ubuntu-latest
    # BUNDLE_GEMFILE must be job-level so setup-ruby installs and
    # caches against the matrix gemfile instead of the root Gemfile.
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  # Every public object under lib/amazon_sp_clients/v2 must carry a
  # doc comment; .yardopts scopes the check.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake yard:verify

  # Regenerates vendor/ at the pinned Amazon spec revision and fails
  # if the committed files drift from what the generator produces.
  verify-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake generate:verify
