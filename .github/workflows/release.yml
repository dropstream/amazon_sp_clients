name: Release

# A version tag is the only release path. It builds the gem, pushes it
# to rubygems.org through Trusted Publishing (no API key stored anywhere)
# and opens a GitHub Release with that version's CHANGELOG entry.
# rubygems.org trusts this workflow file by name; see README, "Releasing".
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub Release
  id-token: write # the OIDC token rubygems.org exchanges for a push key

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # The tag must be "v" plus AmazonSpClients::VERSION.
      - name: Check the tag against version.rb
        run: |
          version=$(ruby -Ilib -e 'require "amazon_sp_clients/version"; puts AmazonSpClients::VERSION')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version}" >&2
            exit 1
          fi

      # The release notes are the CHANGELOG section for this version.
      - name: Extract the CHANGELOG entry
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "CHANGELOG.md has no entry for ${GITHUB_REF_NAME#v}" >&2
            exit 1
          fi

      - run: bundle exec rspec
      - run: gem build amazon_sp_clients.gemspec

      # Trades this job's OIDC token for a short-lived rubygems.org key
      # that can push only this gem. Needs the trusted publisher set up
      # on rubygems.org for repository dropstream/amazon_sp_clients and
      # workflow release.yml.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Push the gem to rubygems.org
        run: gem push amazon_sp_clients-*.gem

      - name: Create the GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" amazon_sp_clients-*.gem --title "${GITHUB_REF_NAME}" --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}
